<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Connection</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e3e6ea;
    --ok: #1a7f4b; --ok-bg: #e5f5ec; --warn: #9a6200; --warn-bg: #fdf3e1; --bad: #b42318; --bad-bg: #fdecea;
    --accent: #1f6feb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #9aa4b1; --line: #2a3038;
      --ok: #4ccf8a; --ok-bg: #12301f; --warn: #f0b44c; --warn-bg: #33270f; --bad: #ff7a6e; --bad-bg: #3a1714;
      --accent: #4b8df8; --accent-text: #0b0e12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .ok { color: var(--ok); background: var(--ok-bg); }
  .warn { color: var(--warn); background: var(--warn-bg); }
  .bad { color: var(--bad); background: var(--bad-bg); }
  .muted { color: var(--muted); }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 16px; }
  .qr img { width: 264px; height: 264px; image-rendering: pixelated; background: #fff; padding: 12px; border-radius: 8px; border: 1px solid var(--line); }
  ol { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  ul.chats { margin: 8px 0 0; padding-left: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>WhatsApp connection</h1>
  <p class="sub">Link the agents' WhatsApp bridge to your account.</p>

  <section class="card">
    <div class="row">
      <span id="pill" class="pill warn">Checking…</span>
      <div>
        <button id="newQr" class="primary" hidden>New QR code</button>
        <button id="unlink" class="danger" hidden>Unlink</button>
        <button id="confirmUnlink" class="danger" hidden>Yes, unlink this device</button>
        <button id="cancelUnlink" hidden>Cancel</button>
      </div>
    </div>
    <p id="message" class="muted"></p>

    <div id="qrBox" class="qr" hidden>
      <img id="qr" alt="WhatsApp pairing QR code">
      <span id="qrAge" class="muted"></span>
    </div>
    <ol id="steps" hidden>
      <li>Open WhatsApp on your phone.</li>
      <li>Go to <b>Settings → Linked devices → Link a device</b>.</li>
      <li>Scan this code. It refreshes on its own every ~20 seconds.</li>
    </ol>

    <dl id="account" hidden>
      <dt>Name</dt><dd id="pushName">—</dd>
      <dt>Number</dt><dd id="number">—</dd>
    </dl>
  </section>

  <section class="card">
    <div class="row"><strong>Watched chats</strong><span class="muted">WHATSAPP_WATCH_CHATS</span></div>
    <ul id="chats" class="chats"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const STATES = {
  connected:     ['ok',   'Connected',        'Messages in watched chats reach the agents.'],
  connecting:    ['warn', 'Connecting…',      'Reconnecting to WhatsApp.'],
  starting:      ['warn', 'Starting…',        'The bridge is starting.'],
  pairing:       ['warn', 'Waiting for scan', 'Scan the code below with your phone.'],
  qr_expired:    ['bad',  'QR code expired',  'No scan in time. Get a new code to try again.'],
  logged_out:    ['bad',  'Unlinked',         'Restarting the bridge to pair again…'],
  error:         ['bad',  'Error',            ''],
  bridge_down:   ['bad',  'Bridge not running', 'The agents server is restarting the bridge.'],
  other_bridge:  ['bad',  'Another bridge is running', 'Stop the other WhatsApp bridge (port 8080), then restart the agents.'],
  off:           ['bad',  'Bridge off',       'Started with WHATSAPP_BRIDGE=off.'],
};
let qrShownAt = 0;
let confirming = false;

async function post(path) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (!res.ok) throw new Error(await res.text());
}

function render(s) {
  const [tone, label, msg] = STATES[s.state] ?? ['warn', s.state, ''];
  const pill = $('pill');
  pill.className = `pill ${tone}`;
  pill.textContent = label;
  $('message').textContent = s.error ? `${msg} ${s.error}`.trim() : msg;

  const pairing = s.state === 'pairing';
  $('qrBox').hidden = !pairing;
  $('steps').hidden = !pairing;
  if (pairing && (Date.now() - qrShownAt > 3000 || s.qr_age_s < 3)) {
    $('qr').src = `/whatsapp/qr.png?t=${Date.now()}`;
    qrShownAt = Date.now();
  }
  $('qrAge').textContent = pairing && s.qr_age_s != null ? `Code issued ${s.qr_age_s}s ago` : '';

  const connected = s.state === 'connected';
  $('account').hidden = !connected;
  $('pushName').textContent = s.push_name || '—';
  $('number').textContent = s.account ? `+${s.account}` : '—';

  $('newQr').hidden = s.state !== 'qr_expired';
  $('unlink').hidden = !connected || confirming;
  $('confirmUnlink').hidden = !connected || !confirming;
  $('cancelUnlink').hidden = !connected || !confirming;

  const chats = $('chats');
  chats.replaceChildren(...(s.watch?.length ? s.watch : ['Every chat (1:1 included) — set WHATSAPP_WATCH_CHATS']).map((c) => {
    const li = document.createElement('li');
    li.textContent = c;
    return li;
  }));
}

async function refresh() {
  try {
    const res = await fetch('/whatsapp/status', { cache: 'no-store' });
    render(await res.json());
  } catch {
    render({ state: 'error', error: 'Agents server not reachable.' });
  }
}

$('newQr').onclick = () => post('/whatsapp/pair').then(refresh).catch((e) => render({ state: 'error', error: e.message }));
$('unlink').onclick = () => { confirming = true; refresh(); };
$('cancelUnlink').onclick = () => { confirming = false; refresh(); };
$('confirmUnlink').onclick = () => {
  confirming = false;
  post('/whatsapp/logout').then(refresh).catch((e) => render({ state: 'error', error: e.message }));
};

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
